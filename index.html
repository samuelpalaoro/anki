<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kartei — Flashcards &amp; Repetição Espaçada</title>
  <meta name="description" content="Aplicativo de flashcards com repetição espaçada. Estude mais em menos tempo com revisões inteligentes e persistência local no navegador.">

  <!-- Google Fonts preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- PWA / Theme -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0d0f12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kartei">

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./assets/icons/icon-512.png">
  <!-- Apple Touch Icon (required for iOS "Add to Home Screen") -->
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">

  <!-- Stylesheets (order matters) -->
  <link rel="stylesheet" href="./src/styles/tokens.css">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/layout.css">
  <link rel="stylesheet" href="./src/styles/components.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar / Top Nav -->
    <aside class="app-sidebar" role="navigation" aria-label="Navegação principal">
      <div class="sidebar-header">
        <!-- Brand removed from visible header per UX spec.
             Name is preserved in <title>, manifest, and meta tags. -->
        <div class="sidebar-header-spacer" aria-hidden="true"></div>

        <!-- PWA Install button — hidden by default, shown by pwa-install.js when available -->
        <button
          id="btn-pwa-install"
          class="btn-icon-nav"
          style="display: none;"
          aria-label="Instalar aplicativo"
          title="Instalar aplicativo"
        >
          <svg aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>
        </button>
      </div>

      <nav class="sidebar-nav" aria-label="Seções do aplicativo">
        <a href="#/cards" class="nav-link" data-route="/cards" aria-label="Cartões">
          <svg class="nav-icon" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
          </svg>
          Cartões
        </a>
        <a href="#/decks" class="nav-link" data-route="/decks" aria-label="Baralhos">
          <svg class="nav-icon" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
          </svg>
          Baralhos
        </a>
        <a href="#/study" class="nav-link" data-route="/study" aria-label="Estudar">
          <svg class="nav-icon" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
          </svg>
          Estudar
        </a>
      </nav>

      <footer class="sidebar-footer">
        <a href="#/settings" class="nav-link-subtle" data-route="/settings" aria-label="Configurações e Backup">
          <svg style="width: 16px; height: 16px; flex-shrink: 0;" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          Configurações
        </a>
      </footer>
    </aside>

    <!-- Main Content -->
    <main class="app-main" id="app-main" role="main">
      <div id="app-view-container" class="app-content"></div>
    </main>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
